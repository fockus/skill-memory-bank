name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist build
          pip install -e ".[codegraph,yaml]"

      - name: Setup bats
        uses: bats-core/bats-action@3.0.0
        with:
          bats-version: 1.11.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Install shellcheck and GNU parallel
        # Nine bats tests shell out to `shellcheck` to assert their script is
        # error-clean. It was only installed in the `lint` job, so here they got
        # 127 and failed — a self-check that never ran on the machine it was
        # written for. Installing it is the honest fix; skipping when absent
        # would keep the gate green while checking nothing.
        run: |
          # GNU parallel backs `bats --jobs`: the suites run in parallel (hours → minutes).
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck parallel
          else
            sudo apt-get update && sudo apt-get install -y shellcheck parallel
          fi
          shellcheck --version
          echo "BATS_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

      - name: Homebrew formula version invariant (fail fast on drift)
        run: python -m pytest tests/pytest/test_homebrew_formula_version.py -q

      - name: Run bats unit tests
        run: bats --jobs "$BATS_JOBS" --filter-tags '!perf' tests/bats/

      - name: Run bats wall-clock budget tests (alone, not beside parallel jobs)
        run: bats --filter-tags perf tests/bats/

      - name: Run bats e2e tests
        run: bats --jobs "$BATS_JOBS" tests/e2e/

      - name: Run bats hook tests
        run: bats hooks/tests/*.bats

      - name: Run pytest with coverage
        run: |
          python -m pytest hooks/tests/ tests/pytest/ -n auto \
            -o python_files='*_test.py test_*.py' \
            --cov \
            --cov-report=term-missing \
            --cov-fail-under=85

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned on purpose: an unpinned ruff turned this job red on 2026-07-15
        # without a single line of code changing — a new release widened UP031
        # and 168 pre-existing violations appeared at once. A lint gate that can
        # go red on its own is not a gate. Bump deliberately, with the fixes.
        run: pip install ruff==0.15.0

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          shellcheck --version
          shellcheck -x --source-path=SCRIPTDIR scripts/*.sh
          shellcheck hooks/*.sh
          shellcheck -x --severity=error hooks/lib/*.sh adapters/*.sh install.sh

      - name: Run ruff on Python files
        run: ruff check scripts/ hooks/lib/ memory_bank_skill/ settings/ tests/pytest/
