name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # nightly: the full suite on macOS
  workflow_dispatch:

# Each suite is split into shards on parallel runners (.github/ci-run.sh); a push
# finishes in ~15 min instead of ~2.5 h. Full Linux on every push, a quick subset on
# macOS (free plans run at most 5 macOS jobs at once); the full macOS run is nightly.
jobs:
  test:
    name: ${{ matrix.suite }} ${{ matrix.k }}/${{ matrix.n }} (${{ matrix.os }}, py${{ matrix.py }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 1, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 2, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 3, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 4, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 5, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 6, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 7, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: bats, k: 8, n: 8 }
          - { os: ubuntu-latest, py: "3.12", suite: serial, k: 1, n: 1 }
          - { os: ubuntu-latest, py: "3.12", suite: e2e, k: 1, n: 3 }
          - { os: ubuntu-latest, py: "3.12", suite: e2e, k: 2, n: 3 }
          - { os: ubuntu-latest, py: "3.12", suite: e2e, k: 3, n: 3 }
          - { os: ubuntu-latest, py: "3.12", suite: pytest, k: 1, n: 4, cov: 1 }
          - { os: ubuntu-latest, py: "3.12", suite: pytest, k: 2, n: 4, cov: 1 }
          - { os: ubuntu-latest, py: "3.12", suite: pytest, k: 3, n: 4, cov: 1 }
          - { os: ubuntu-latest, py: "3.12", suite: pytest, k: 4, n: 4, cov: 1 }
          # Python 3.11 portability: the quick subset (installer/host-runtime tests are version-neutral)
          - { os: ubuntu-latest, py: "3.11", suite: pytest-quick, k: 1, n: 1 }
          - { os: ubuntu-latest, py: "3.12", suite: node, k: 1, n: 1 }
          - { os: macos-latest, py: "3.12", suite: bats-quick, k: 1, n: 3 }
          - { os: macos-latest, py: "3.12", suite: bats-quick, k: 2, n: 3 }
          - { os: macos-latest, py: "3.12", suite: bats-quick, k: 3, n: 3 }
          - { os: macos-latest, py: "3.12", suite: pytest-quick, k: 1, n: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tests
        with:
          python-version: ${{ matrix.py }}
          host-runtimes: ${{ startsWith(matrix.suite, 'pytest') || matrix.suite == 'node' }}
      - name: Run tests
        env:
          CI_COVERAGE: ${{ matrix.cov }}
        run: .github/ci-run.sh "${{ matrix.suite }}" "${{ matrix.k }}" "${{ matrix.n }}"
      - name: Upload coverage data
        if: ${{ !cancelled() && matrix.cov == 1 }}   # also from a red shard: the gate reports a real number
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.k }}
          path: .coverage.${{ matrix.k }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: coverage (≥85%, all pytest shards)
    needs: test
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install coverage
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine shards and check the gate
        run: |
          coverage combine
          coverage report --skip-covered --fail-under=85

  macos-full:
    name: macOS full ${{ matrix.suite }} ${{ matrix.k }}/${{ matrix.n }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: bats, k: 1, n: 5 }
          - { suite: bats, k: 2, n: 5 }
          - { suite: bats, k: 3, n: 5 }
          - { suite: bats, k: 4, n: 5 }
          - { suite: bats, k: 5, n: 5 }
          - { suite: serial, k: 1, n: 1 }
          - { suite: e2e, k: 1, n: 2 }
          - { suite: e2e, k: 2, n: 2 }
          - { suite: pytest, k: 1, n: 2 }
          - { suite: pytest, k: 2, n: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tests
        with:
          python-version: "3.12"
          host-runtimes: ${{ startsWith(matrix.suite, 'pytest') }}
      - name: Run tests
        run: .github/ci-run.sh "${{ matrix.suite }}" "${{ matrix.k }}" "${{ matrix.n }}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned on purpose: an unpinned ruff turned this job red on 2026-07-15
        # without a single line of code changing — a new release widened UP031
        # and 168 pre-existing violations appeared at once. A lint gate that can
        # go red on its own is not a gate. Bump deliberately, with the fixes.
        run: pip install ruff==0.15.0

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          shellcheck --version
          shellcheck -x --source-path=SCRIPTDIR scripts/*.sh
          shellcheck hooks/*.sh
          shellcheck -x --severity=error hooks/lib/*.sh adapters/*.sh install.sh

      - name: Run ruff on Python files
        run: ruff check scripts/ hooks/lib/ memory_bank_skill/ settings/ tests/pytest/
