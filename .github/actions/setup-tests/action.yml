name: setup-tests
description: Python, bats, shellcheck and GNU parallel for .github/ci-run.sh
inputs:
  python-version:
    description: Python version
    required: true
  host-runtimes:
    description: "true: Node 22 + the Pi SDK, which the Pi-native pytest modules drive"
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # hatchling: the wheel/sdist tests build offline; numpy: the embeddings-store tests.
        pip install pytest pytest-cov pytest-xdist build hatchling numpy
        pip install -e ".[codegraph,yaml]"

    - name: Setup bats
      uses: bats-core/bats-action@3.0.0
      with:
        bats-version: 1.11.0
        support-install: false
        assert-install: false
        detik-install: false
        file-install: false

    # Nine bats tests shell out to `shellcheck` to assert their script is error-clean;
    # GNU parallel backs `bats --jobs`.
    - name: Install shellcheck and GNU parallel
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install shellcheck parallel
        else
          sudo apt-get update && sudo apt-get install -y shellcheck parallel
        fi

    - name: Setup Node
      if: inputs.host-runtimes == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    # Pinned to the version the Pi-native tests are verified against.
    - name: Install the Pi SDK
      if: inputs.host-runtimes == 'true'
      shell: bash
      run: npm install -g @earendil-works/pi-coding-agent@1.5.0 && pi --version

    # Pinned and checksum-verified: the OpenCode V2 native acceptance tests drive this
    # binary (verified on 2.0.18 and 2.3.2). Linux only; elsewhere those tests skip.
    - name: Install OpenCode
      if: inputs.host-runtimes == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        OPENCODE_VERSION: v2.3.2
        OPENCODE_SHA256: 563b5d663637226b6e3bb4bb6803281bc39b0d2cd88db06d674b6420aab009b0
      run: |
        dir="$RUNNER_TEMP/opencode"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/opencode.tar.gz" \
          "https://github.com/sst/opencode/releases/download/$OPENCODE_VERSION/opencode-linux-x64.tar.gz"
        echo "$OPENCODE_SHA256  $dir/opencode.tar.gz" | sha256sum -c -
        tar -xzf "$dir/opencode.tar.gz" -C "$dir" opencode
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/opencode" --version
